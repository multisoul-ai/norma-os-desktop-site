<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Norma iOS 伴侣 · 原型变体</title>
<style>
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --ink: #000000;
    --secondary: #3c3c43;
    --muted: #8e8e93;
    --hairline: rgba(60, 60, 67, 0.18);
    --fill: rgba(120, 120, 128, 0.12);
    --fill-strong: rgba(120, 120, 128, 0.2);
    --blue: #007aff;
    --orange: #ff9f0a;
    --red: #ff3b30;
    --green: #34c759;
    --purple: #af52de;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --phone-w: 390px;
    --phone-h: 844px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #1c1c1e;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  /* —— Picker (verbatim PICKER.md, top) —— */
  .proto-picker {
    position: fixed; bottom: auto; top: 20px; left: 50%;
    transform: translateX(-50%); z-index: 2147483647;
    display: flex; align-items: center; gap: 2px; padding: 4px;
    border-radius: 999px; background: rgba(10, 10, 10, 0.82);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    backdrop-filter: blur(12px) saturate(1.4);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 8px 24px rgba(0, 0, 0, 0.24),
      0 2px 6px rgba(0, 0, 0, 0.12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px; line-height: 1;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  .proto-picker-highlight {
    position: absolute; top: 4px; left: 0; height: 28px;
    border-radius: 999px; background: rgba(255, 255, 255, 0.12);
    will-change: transform;
  }
  .proto-picker[data-ready] .proto-picker-highlight {
    transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
      width 250ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
  }
  .proto-picker-item {
    position: relative; display: flex; align-items: center;
    height: 28px; padding: 0 12px; border: 0; border-radius: 999px;
    background: transparent; color: rgba(255, 255, 255, 0.55);
    font: inherit; cursor: pointer; transition: color 150ms ease-out;
  }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px;
  }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider {
    width: 1px; height: 16px; margin: 0 4px;
    background: rgba(255, 255, 255, 0.12);
  }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }

  #stage {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 64px 12px 48px;
  }
  .doc-link {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 12px; color: rgba(255,255,255,.45);
    text-decoration: none; white-space: nowrap;
  }
  .doc-link:hover { color: rgba(255,255,255,.8); }

  /* —— Phone chrome —— */
  .phone {
    width: min(100%, var(--phone-w));
    height: min(90vh, var(--phone-h));
    background: var(--bg);
    border-radius: 47px;
    box-shadow:
      0 0 0 3px #2c2c2e,
      0 0 0 11px #0a0a0a,
      0 40px 100px rgba(0,0,0,.55);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 5;
    pointer-events: none;
  }
  .status {
    height: 54px; padding: 14px 28px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    font-size: 15px; font-weight: 600; flex-shrink: 0; position: relative; z-index: 2;
  }
  .status .right {
    display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;
  }
  .status svg { display: block; }

  .scroll {
    flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
    padding: 0 16px 108px;
    scrollbar-width: none;
  }
  .scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .scroll.top-composer { padding-top: 0; padding-bottom: 28px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin: 2px 0 6px;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 0; background: var(--fill); color: var(--ink);
    display: grid; place-items: center; cursor: pointer;
    transition: transform 100ms ease-out, background 120ms ease-out;
  }
  .icon-btn:hover { background: var(--fill-strong); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn.ghost { background: transparent; color: var(--blue); width: auto; height: auto; padding: 8px 4px; font-size: 17px; font-weight: 400; }
  .topbar-actions { display: flex; gap: 8px; }

  .large-title {
    font-size: 34px; font-weight: 700; letter-spacing: -0.03em;
    line-height: 1.1; margin: 0 0 4px;
  }
  .subtitle {
    font-size: 15px; color: var(--muted); margin: 0 0 18px;
  }

  /* Inset grouped list (Cursor / iOS) */
  .group {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .row {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px 14px 13px;
    position: relative;
    background: var(--surface);
  }
  .row + .row::before {
    content: "";
    position: absolute; left: 54px; right: 0; top: 0;
    height: 1px; background: var(--hairline);
  }
  .glyph {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center; flex-shrink: 0; margin-top: 1px;
    color: #fff;
  }
  .glyph.ask { background: var(--blue); }
  .glyph.perm { background: var(--orange); }
  .glyph.fail { background: var(--red); }
  .glyph.done { background: var(--green); }
  .glyph.agent { background: #5e5ce6; }
  .glyph.idle { background: #8e8e93; }
  .row-body { flex: 1; min-width: 0; }
  .row-title {
    font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
    line-height: 1.25; margin: 0 0 3px;
  }
  .row-meta {
    font-size: 13px; color: var(--muted); line-height: 1.3; margin: 0 0 6px;
  }
  .row-plan {
    font-size: 14px; color: var(--secondary); line-height: 1.35;
    margin: 0 0 10px;
  }
  .row-actions {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    border: 0; border-radius: 980px; padding: 7px 13px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform 100ms ease-out, opacity 100ms ease-out;
  }
  .chip:active { transform: scale(0.96); }
  .chip.primary { background: var(--blue); color: #fff; }
  .chip.secondary { background: var(--fill); color: var(--ink); }
  .chip.link {
    background: transparent; color: var(--blue); padding: 7px 4px; font-weight: 500;
  }

  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 4px 8px;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .section-head button {
    border: 0; background: transparent; color: var(--blue);
    font-size: 15px; font-weight: 400; cursor: pointer;
  }

  .link-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; background: var(--surface);
    border-radius: 14px; margin-bottom: 16px;
    cursor: pointer; border: 0; width: 100%; text-align: left;
    transition: background 120ms ease-out;
  }
  .link-row:active { background: #ebebed; }
  .link-row .t { flex: 1; font-size: 17px; font-weight: 600; }
  .link-row .m { font-size: 15px; color: var(--muted); }
  .chev { color: var(--muted); font-size: 18px; font-weight: 300; }

  /* Hub tiles — Cursor inbox grid */
  .hub-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 20px;
  }
  .hub-tile {
    background: var(--surface); border: 0; border-radius: 16px;
    padding: 14px 14px 16px; text-align: left; cursor: pointer;
    min-height: 88px;
    transition: transform 100ms ease-out, background 120ms ease-out;
  }
  .hub-tile:active { transform: scale(0.98); }
  .hub-tile.active { box-shadow: inset 0 0 0 2px var(--blue); }
  .hub-tile .ico {
    width: 28px; height: 28px; border-radius: 8px;
    display: grid; place-items: center; margin-bottom: 14px; color: #fff;
  }
  .hub-tile .lab {
    font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
  }
  .hub-tile .cnt {
    font-size: 13px; color: var(--muted); margin-top: 2px;
  }

  /* Composer */
  .composer {
    position: absolute; left: 12px; right: 12px; bottom: 22px;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: 999px;
    background: rgba(255,255,255,.94);
    box-shadow: 0 2px 16px rgba(0,0,0,.1), 0 0 0 0.5px rgba(0,0,0,.06);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    z-index: 6;
  }
  .composer.sticky-top {
    position: sticky; top: 0; bottom: auto;
    margin: 0 -16px 14px; border-radius: 0;
    padding: 10px 16px 12px;
    background: rgba(242,242,247,.92);
    box-shadow: none; border-bottom: 0.5px solid var(--hairline);
  }
  .composer.sticky-top .pill {
    display: flex; align-items: center; gap: 8px; flex: 1;
    background: var(--surface); border-radius: 999px; padding: 7px 8px;
    box-shadow: 0 1px 8px rgba(0,0,0,.06);
  }
  .composer .circ {
    width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: var(--fill); display: grid; place-items: center;
    cursor: pointer; flex-shrink: 0; color: var(--ink);
  }
  .composer .circ:active { transform: scale(0.94); }
  .composer input {
    flex: 1; border: 0; outline: none; background: transparent;
    font-size: 16px; color: var(--ink); min-width: 0;
  }
  .composer input::placeholder { color: var(--muted); }

  .toast {
    position: absolute; left: 24px; right: 24px; top: 62px;
    background: rgba(28,28,30,.94); color: #fff; border-radius: 12px;
    padding: 11px 14px; font-size: 14px; z-index: 40;
    opacity: 0; transform: translateY(-8px); pointer-events: none;
  }
  .toast.show {
    animation: toast-in 240ms var(--ease) forwards;
  }
  @keyframes toast-in {
    to { opacity: 1; transform: translateY(0); }
  }

  .empty {
    text-align: center; padding: 56px 24px 32px;
  }
  .empty h2 {
    margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
  }
  .empty p { margin: 0; font-size: 15px; color: var(--muted); }

  .clarify {
    background: var(--surface); border-radius: 14px; padding: 14px;
    margin-bottom: 16px;
    box-shadow: inset 0 0 0 1px rgba(0,122,255,.25);
  }
  .clarify .tag {
    font-size: 12px; font-weight: 600; color: var(--blue); margin-bottom: 6px;
  }
  .clarify h3 { margin: 0 0 12px; font-size: 17px; font-weight: 600; }

  /* Zoom chat */
  .zoom-head {
    display: flex; align-items: center; gap: 4px; margin: 0 0 16px;
  }
  .zoom-head strong {
    flex: 1; text-align: center; font-size: 17px; margin-right: 36px;
  }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: 18px;
    margin-bottom: 8px; font-size: 16px; line-height: 1.35;
  }
  .bubble.them { background: #e9e9eb; border-bottom-left-radius: 6px; }
  .bubble.me {
    background: var(--blue); color: #fff; margin-left: auto;
    border-bottom-right-radius: 6px;
  }
  .zoom-composer {
    display: flex; gap: 8px; margin-top: 20px; align-items: center;
  }
  .zoom-composer input {
    flex: 1; border: 0; background: var(--fill); border-radius: 18px;
    padding: 11px 14px; font-size: 16px; outline: none;
  }

  /* Agents */
  .agent-row { align-items: center; }
  .agent-row .row-title { margin-bottom: 2px; }
  .agent-row .row-meta { margin: 0; }

  /* Lock */
  .lock {
    position: absolute; inset: 0; z-index: 30;
    background:
      radial-gradient(120% 80% at 70% 20%, #6b8f71 0%, transparent 55%),
      linear-gradient(180deg, #2a4a38 0%, #0c1a14 45%, #071008 100%);
    color: #fff; display: flex; flex-direction: column;
    padding: 20px 22px 28px;
  }
  .lock .carrier {
    display: flex; justify-content: space-between;
    font-size: 12px; font-weight: 600; opacity: .9; padding: 0 6px;
  }
  .lock .clock {
    text-align: center; font-size: 78px; font-weight: 500;
    letter-spacing: -0.04em; line-height: 1; margin-top: 36px;
    color: rgba(200, 230, 200, .92);
  }
  .lock .date {
    text-align: center; font-size: 17px; font-weight: 500;
    color: rgba(255,255,255,.78); margin-bottom: auto;
  }
  .live {
    background: rgba(20, 20, 22, .78);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-radius: 24px; padding: 14px 16px 12px; margin-bottom: 18px;
  }
  .live .top {
    display: flex; justify-content: space-between;
    font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 6px;
  }
  .live h2 {
    margin: 0 0 6px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
  }
  .live .next { font-size: 15px; color: rgba(255,255,255,.88); line-height: 1.3; }
  .live .repo { font-size: 13px; color: rgba(255,255,255,.45); margin-top: 10px; }
  .lock-actions {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 8px;
  }
  .lock-round {
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,.18); border: 0; color: #fff;
    display: grid; place-items: center; cursor: pointer;
  }
  .lock-open {
    border: 0; background: rgba(255,255,255,.2); color: #fff;
    border-radius: 999px; padding: 12px 22px; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  .home-bar {
    width: 134px; height: 5px; border-radius: 3px;
    background: rgba(255,255,255,.35); margin: 18px auto 0;
  }
</style>
</head>
<body>
  <nav class="proto-picker" data-position="top" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Quiet</button>
    <button class="proto-picker-item">Stacked</button>
    <button class="proto-picker-item">Hub</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <div id="stage"></div>
  <a class="doc-link" href="./MODULES.md" target="_blank">模块设计说明</a>

<script>
const ICONS = {
  ask: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="#fff" stroke-width="1.5"/><path d="M8 7.2v4M8 5v.8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  perm: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" stroke="#fff" stroke-width="1.5"/><path d="M5.5 7V5.2a2.5 2.5 0 015 0V7" stroke="#fff" stroke-width="1.5"/></svg>`,
  fail: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2.5 14 13H2L8 2.5Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 7v3M8 11.5v.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  done: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5 6.5 11.5 12.5 4.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  plus: `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 4v10M4 9h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,

  agents: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="5" cy="5" r="2" fill="#fff"/><circle cx="11" cy="5" r="2" fill="#fff"/><circle cx="5" cy="11" r="2" fill="#fff"/><circle cx="11" cy="11" r="2" fill="#fff"/></svg>`,
  bell: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2.5a3.5 3.5 0 013.5 3.5v2.2l1.2 2.3H3.3L4.5 8.2V6A3.5 3.5 0 018 2.5Z" stroke="#fff" stroke-width="1.4"/><path d="M6.5 13a1.5 1.5 0 003 0" stroke="#fff" stroke-width="1.4"/></svg>`,
  digest: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="2.5" width="10" height="11" rx="2" stroke="#fff" stroke-width="1.4"/><path d="M5.5 6h5M5.5 8.5h5M5.5 11h3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  lock: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" stroke="#fff" stroke-width="1.4"/><path d="M5.5 7V5.2a2.5 2.5 0 015 0V7" stroke="#fff" stroke-width="1.4"/></svg>`,
  back: `<svg width="12" height="20" viewBox="0 0 12 20" fill="none"><path d="M10 2 2 10l8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  search: `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="m12.5 12.5 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  flash: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M11 2 5 11h5l-1 7 6-9h-5l1-7Z" fill="#fff"/></svg>`,
  cam: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="5" width="12" height="10" rx="2" stroke="#fff" stroke-width="1.5"/><path d="m14 8 4-2v8l-4-2V8Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>`,
  signal: `<svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.6"/><rect x="4.5" y="5" width="3" height="7" rx="0.6"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.6"/><rect x="13.5" y="0" width="3" height="12" rx="0.6" opacity=".35"/></svg>`,
  bat: `<svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="currentColor"/><path d="M23 4v4a2 2 0 000-4Z" fill="currentColor"/></svg>`,
};

const INITIAL = () => ({
  screen: "home",
  focusHub: "need",
  continueHint: "继续：修登录失败…",
  toast: "",
  zoomAgent: null,
  inlineClarify: null,
  digestOpen: false,
  items: [
    { id: "q1", badge: "提问", kind: "ask", title: "登录失败怎么处理？", source: "Ada", plan: "下一步：选 mock 还是修真 API", evidence: null },
    { id: "p1", badge: "权限", kind: "perm", title: "批准外发 PR #482", source: "Norma", plan: "下一步：批准 revert #482 或改 fixture", evidence: "github.com/…/pull/482" },
    { id: "f1", badge: "失败", kind: "fail", title: "e2e 在 CI 红了", source: "Cody", plan: "下一步：重跑 flaky 或开 issue", evidence: null },
    { id: "d1", badge: "提问", kind: "ask", title: "沙箱修复已预备", source: "Ada", plan: "方案已核验：应用 patch 并跑单测", evidence: null, prepared: true },
  ],
  digest: [
    { id: "done1", title: "依赖扫描通过", source: "Cody", when: "10:12" },
    { id: "done2", title: "登录页文案已改", source: "Ada", when: "09:40" },
  ],
});

let S = INITIAL();

function applyDemo() {
  const demo = new URLSearchParams(location.search).get("demo") || "";
  if (demo === "lock") S.screen = "lock";
  else if (demo === "agents") S.screen = "agents";
  else if (demo === "zoom") {
    S.zoomAgent = S.items[0] || null;
    S.screen = S.zoomAgent ? "zoom" : "home";
  } else if (demo === "empty") {
    S.items = [];
    S.continueHint = "";
    S.inlineClarify = null;
  } else if (demo === "digest") {
    S.focusHub = "digest";
    S.digestOpen = true;
  }
}

function toast(msg) {
  S.toast = msg;
  refresh();
  setTimeout(() => {
    if (S.toast === msg) { S.toast = ""; refresh(); }
  }, 1600);
}

function approve(id) {
  const i = S.items.findIndex((x) => x.id === id);
  if (i < 0) return;
  const [it] = S.items.splice(i, 1);
  if (!S.items.length) S.continueHint = "";
  toast(`已处理 · ${it.badge}`);
}

function sendCommand(text) {
  const t = (text || "").trim();
  if (!t) return;
  if (/支付|清理/.test(t)) {
    S.items.unshift({
      id: "n" + Date.now(), badge: "提问", kind: "ask",
      title: "「支付相关」范围太大", source: "Norma",
      plan: "下一步：先只做沙箱，还是包含生产？", evidence: null,
    });
    S.inlineClarify = null;
    S.continueHint = "";
    toast("复杂澄清已进「需要你」");
  } else if (/登录|修/.test(t) && !S.inlineClarify) {
    S.inlineClarify = { q: "用 mock 还是修真 API？", a: "mock", b: "真 API" };
    toast("短澄清 · 内联");
  } else {
    S.continueHint = "";
    toast("已交给 Norma");
  }
  refresh();
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
}

function statusBar(light) {
  const c = light ? "#fff" : "currentColor";
  return `
  <div class="status" style="${light ? "color:#fff" : ""}">
    <span>9:41</span>
    <span class="right" style="color:${light ? "rgba(255,255,255,.9)" : "var(--ink)"}">
      ${ICONS.signal}${ICONS.bat}
    </span>
  </div>`;
}

function toastEl() {
  return `<div class="toast ${S.toast ? "show" : ""}" role="status">${esc(S.toast || "")}</div>`;
}

function composer(opts) {
  const top = opts && opts.top;
  const ph = S.continueHint || "对 Norma 说点什么…";
  const inner = `
    <button type="button" class="circ" data-act="agents" title="全部 Agent">${ICONS.plus}</button>
    <input name="q" placeholder="${esc(ph)}" autocomplete="off" />
    <button type="button" class="circ" data-act="mic" title="语音">${ICONS.mic}</button>
    ${S.continueHint ? `<button type="button" class="circ" data-act="clear-hint" title="清除" style="font-size:16px;font-weight:600">×</button>` : ""}`;
  if (top) {
    return `<form class="composer sticky-top" data-composer onsubmit="return false;"><div class="pill">${inner}</div></form>`;
  }
  return `<form class="composer" data-composer onsubmit="return false;">${inner}</form>`;
}

function decisionRows() {
  if (!S.items.length) {
    return `<div class="empty"><h2>暂时没有需要你的事</h2><p>Norma 会在需要时找你</p></div>`;
  }
  return `<div class="group">${S.items.map((it) => `
    <div class="row">
      <div class="glyph ${it.kind}">${ICONS[it.kind]}</div>
      <div class="row-body">
        <div class="row-title">${esc(it.title)}</div>
        <div class="row-meta">${esc(it.badge)} · ${esc(it.source)}${it.evidence ? " · " + esc(it.evidence) : ""}${it.prepared ? " · 已核验" : ""}</div>
        <div class="row-plan">${esc(it.plan)}</div>
        <div class="row-actions">
          <button class="chip primary" data-act="approve" data-id="${it.id}">${it.badge === "权限" ? "批准" : "处理"}</button>
          <button class="chip secondary" data-act="later" data-id="${it.id}">稍后</button>
          <button class="chip link" data-act="zoom" data-id="${it.id}">看上下文</button>
        </div>
      </div>
    </div>`).join("")}</div>`;
}

function digestBlock(mode) {
  // mode: row | open | stacked
  if (mode === "row") {
    return `
    <button class="link-row" data-act="toggle-digest">
      <div class="glyph done">${ICONS.done}</div>
      <span class="t">摘要</span>
      <span class="m">${S.digest.length}</span>
      <span class="chev">${S.digestOpen ? "▾" : "›"}</span>
    </button>
    ${S.digestOpen ? digestList() : ""}`;
  }
  return `
  <div class="section-head"><span>摘要 · ${S.digest.length}</span></div>
  ${digestList()}`;
}

function digestList() {
  return `<div class="group">${S.digest.map((d) => `
    <div class="row agent-row">
      <div class="glyph done">${ICONS.done}</div>
      <div class="row-body">
        <div class="row-title">${esc(d.title)}</div>
        <div class="row-meta">${esc(d.when)} · ${esc(d.source)}</div>
      </div>
    </div>`).join("")}</div>`;
}

function clarifyBlock() {
  if (!S.inlineClarify) return "";
  const c = S.inlineClarify;
  return `
  <div class="clarify">
    <div class="tag">提问 · Norma</div>
    <h3>${esc(c.q)}</h3>
    <div class="row-actions">
      <button class="chip primary" data-act="inline" data-v="${esc(c.a)}">${esc(c.a)}</button>
      <button class="chip secondary" data-act="inline" data-v="${esc(c.b)}">${esc(c.b)}</button>
    </div>
  </div>`;
}

function topIcons() {
  return `
  <div class="topbar">
    <button class="icon-btn" data-act="lock" title="锁屏示意" aria-label="锁屏">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5.2a2.5 2.5 0 015 0V7" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div class="topbar-actions">
      <button class="icon-btn" data-act="agents" title="全部 Agent">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="5" cy="5" r="1.8" fill="currentColor"/><circle cx="11" cy="5" r="1.8" fill="currentColor"/><circle cx="5" cy="11" r="1.8" fill="currentColor"/><circle cx="11" cy="11" r="1.8" fill="currentColor"/></svg>
      </button>
    </div>
  </div>`;
}

function lockScreen() {
  const top = S.items[0];
  const isRisk = top && (top.badge === "权限" || top.badge === "失败");
  const next = top
    ? (isRisk || top.plan ? top.plan : top.title)
    : "暂时没有需要你的事";
  return `
  <div class="lock" data-lock>
    <div class="carrier"><span>Norma</span><span class="right" style="display:flex;gap:5px;align-items:center">${ICONS.signal}${ICONS.bat}</span></div>
    <div class="clock">9:41</div>
    <div class="date">9月25日 周五</div>
    <div class="live">
      <div class="top"><span>需要你${S.items.length ? " · " + S.items.length : ""}</span><span>刚刚</span></div>
      <h2>${top ? esc(top.title) : "Norma"}</h2>
      <div class="next">${esc(next)}</div>
      <div class="repo">Norma-AI-OS</div>
    </div>
    <div class="lock-actions">
      <button class="lock-round" aria-hidden="true">${ICONS.flash}</button>
      <button class="lock-open" data-act="unlock">打开 App</button>
      <button class="lock-round" aria-hidden="true">${ICONS.cam}</button>
    </div>
    <div class="home-bar"></div>
  </div>`;
}

function zoomScreen() {
  const a = S.zoomAgent;
  if (!a) return "";
  return `
  ${statusBar()}
  <div class="scroll">
    <div class="zoom-head">
      <button class="icon-btn ghost" data-act="home">${ICONS.back}</button>
      <strong>${esc(a.source)}</strong>
    </div>
    <div class="bubble them">我在修登录失败，卡在测试策略上。</div>
    <div class="bubble them">${esc(a.plan)}</div>
    <div class="bubble me">你先列选项，我回来再定。</div>
    <form class="zoom-composer" data-zoom-form onsubmit="return false;">
      <input name="z" value="${esc(a.plan.replace(/^下一步：/, "").replace(/^方案已核验：/, ""))}" />
      <button class="chip primary" data-act="zoom-send">发送</button>
    </form>
  </div>`;
}

function agentsScreen() {
  return `
  ${statusBar()}
  <div class="scroll">
    <div class="topbar">
      <button class="icon-btn ghost" data-act="home">${ICONS.back}</button>
      <div class="topbar-actions">
        <button class="icon-btn" aria-hidden="true">${ICONS.search}</button>
      </div>
    </div>
    <h1 class="large-title">全部 Agent</h1>
    <div class="section-head"><span>Working</span></div>
    <div class="group">
      <div class="row agent-row"><div class="glyph agent">${ICONS.agents}</div><div class="row-body"><div class="row-title">Ada</div><div class="row-meta">Working · 修登录</div></div></div>
      <div class="row agent-row"><div class="glyph agent">${ICONS.agents}</div><div class="row-body"><div class="row-title">Cody</div><div class="row-meta">Working · CI</div></div></div>
    </div>
    <div class="section-head"><span>Idle</span></div>
    <div class="group">
      <div class="row agent-row"><div class="glyph idle">${ICONS.agents}</div><div class="row-body"><div class="row-title">Morgan</div><div class="row-meta">Idle · Norma-AI-OS</div></div></div>
    </div>
  </div>
  ${composer({ top: false })}`;
}

function renderQuiet() {
  if (S.screen === "lock") return `<div class="phone"><div class="island"></div>${lockScreen()}</div>`;
  if (S.screen === "zoom") return `<div class="phone"><div class="island"></div>${zoomScreen()}</div>`;
  if (S.screen === "agents") return `<div class="phone"><div class="island"></div>${agentsScreen()}</div>`;
  return `
  <div class="phone" data-variant="Quiet">
    <div class="island"></div>
    ${toastEl()}
    ${statusBar()}
    <div class="scroll">
      ${topIcons()}
      <h1 class="large-title">需要你</h1>
      <p class="subtitle">${S.items.length ? S.items.length + " 项待处理" : "闸门清空"}</p>
      ${clarifyBlock()}
      ${decisionRows()}
      ${digestBlock("row")}
    </div>
    ${composer({ top: false })}
  </div>`;
}

function renderStacked() {
  if (S.screen === "lock") return `<div class="phone"><div class="island"></div>${lockScreen()}</div>`;
  if (S.screen === "zoom") return `<div class="phone"><div class="island"></div>${zoomScreen()}</div>`;
  if (S.screen === "agents") return `<div class="phone"><div class="island"></div>${agentsScreen()}</div>`;
  return `
  <div class="phone" data-variant="Stacked">
    <div class="island"></div>
    ${toastEl()}
    ${statusBar()}
    <div class="scroll top-composer">
      ${composer({ top: true })}
      ${topIcons()}
      <h1 class="large-title">需要你</h1>
      <p class="subtitle">${S.items.length ? S.items.length + " 项待处理" : "闸门清空"}</p>
      ${clarifyBlock()}
      ${decisionRows()}
      ${digestBlock("stacked")}
    </div>
  </div>`;
}

function renderHub() {
  if (S.screen === "lock") return `<div class="phone"><div class="island"></div>${lockScreen()}</div>`;
  if (S.screen === "zoom") return `<div class="phone"><div class="island"></div>${zoomScreen()}</div>`;
  if (S.screen === "agents") return `<div class="phone"><div class="island"></div>${agentsScreen()}</div>`;
  const need = S.focusHub === "need";
  const dig = S.focusHub === "digest";
  return `
  <div class="phone" data-variant="Hub">
    <div class="island"></div>
    ${toastEl()}
    ${statusBar()}
    <div class="scroll">
      ${topIcons()}
      <h1 class="large-title">今日</h1>
      <p class="subtitle">选一个入口，其余退后</p>
      <div class="hub-grid">
        <button class="hub-tile ${need ? "active" : ""}" data-act="hub" data-hub="need">
          <div class="ico" style="background:var(--orange)">${ICONS.bell}</div>
          <div class="lab">需要你</div>
          <div class="cnt">${S.items.length}</div>
        </button>
        <button class="hub-tile ${dig ? "active" : ""}" data-act="hub" data-hub="digest">
          <div class="ico" style="background:var(--green)">${ICONS.digest}</div>
          <div class="lab">摘要</div>
          <div class="cnt">${S.digest.length}</div>
        </button>
        <button class="hub-tile" data-act="agents">
          <div class="ico" style="background:var(--red)">${ICONS.agents}</div>
          <div class="lab">全部 Agent</div>
          <div class="cnt">3</div>
        </button>
        <button class="hub-tile" data-act="lock">
          <div class="ico" style="background:#636366">${ICONS.lock}</div>
          <div class="lab">锁屏</div>
          <div class="cnt">Live Activity</div>
        </button>
      </div>
      ${clarifyBlock()}
      ${need || (!need && !dig) ? decisionRows() : ""}
      ${dig ? digestBlock("stacked") : ""}
    </div>
    ${composer({ top: false })}
  </div>`;
}

const variants = [renderQuiet, renderStacked, renderHub];
const stage = document.getElementById("stage");
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
const replay = picker.querySelector(".proto-picker-replay");
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function wirePhone(root) {
  root.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.getAttribute("data-act");
    const id = t.getAttribute("data-id");
    if (act === "approve") approve(id);
    else if (act === "later") toast("已稍后 · 仍在「需要你」");
    else if (act === "zoom") {
      const it = S.items.find((x) => x.id === id);
      if (it) { S.screen = "zoom"; S.zoomAgent = it; refresh(); }
    } else if (act === "home") { S.screen = "home"; refresh(); }
    else if (act === "agents") { S.screen = "agents"; refresh(); }
    else if (act === "lock") { S.screen = "lock"; refresh(); }
    else if (act === "unlock") { S.screen = "home"; refresh(); }
    else if (act === "clear-hint") { S.continueHint = ""; refresh(); }
    else if (act === "mic") toast("语音录入（示意）");
    else if (act === "inline") {
      S.inlineClarify = null;
      S.continueHint = `继续：修登录（${t.getAttribute("data-v")}）…`;
      toast(`已选 ${t.getAttribute("data-v")}`);
    } else if (act === "hub") { S.focusHub = t.getAttribute("data-hub"); refresh(); }
    else if (act === "zoom-send") toast("已发到会话");
    else if (act === "toggle-digest") { S.digestOpen = !S.digestOpen; refresh(); }
  });
  const form = root.querySelector("[data-composer]");
  if (form) {
    const input = form.querySelector("input");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      sendCommand(input.value);
      input.value = "";
    });
    input?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendCommand(input.value);
        input.value = "";
      }
    });
  }
}

function mount(i) {
  S = INITIAL();
  applyDemo();
  stage.innerHTML = variants[i]();
  const phone = stage.querySelector(".phone");
  if (phone) wirePhone(phone);
}

function refresh() {
  stage.innerHTML = variants[current]();
  const phone = stage.querySelector(".phone");
  if (phone) wirePhone(phone);
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set("v", i + 1);
  history.replaceState(null, "", url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replay?.addEventListener("click", () => mount(current));
window.addEventListener("resize", moveHighlight);
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() =>
  requestAnimationFrame(() => picker.setAttribute("data-ready", ""))
);
</script>
</body>
</html>
